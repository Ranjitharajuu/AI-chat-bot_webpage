<script>
let voiceEnabled = false; // ✅ OFF by default

function speak(text) {
  if (!voiceEnabled) return;

  window.speechSynthesis.cancel(); // stop previous
  const speech = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(speech);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  const btn = document.getElementById("voiceBtn");

  if (!voiceEnabled) {
    window.speechSynthesis.cancel(); // 🔥 STOP immediately
    btn.innerText = "🔇";
  } else {
    btn.innerText = "🔊";
  }
}

function startVoice() {
  const btn = document.getElementById("micBtn");
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Voice recognition not supported in this browser.");
    return;
  }

  const rec = new Recognition();
  btn.innerText = "🎙️";
  rec.start();

  rec.onresult = e => {
    document.getElementById("userInput").value = e.results[0][0].transcript;
    btn.innerText = "🎤";
  };

  rec.onerror = () => { btn.innerText = "🎤"; };
  rec.onend = () => { btn.innerText = "🎤"; };
}

async function sendMessage() {
  const inputEl = document.getElementById("userInput");
  const text = inputEl.value.trim();
  const chat = document.getElementById("chat");

  if (!text) return;

  chat.innerHTML += `<div class="message user">${text}</div>`;
  inputEl.value = "";
  chat.scrollTop = chat.scrollHeight;

  const tempId = "msg-" + Date.now();
  chat.innerHTML += `
    <div class="message bot" id="${tempId}">
      <div class="typing">AI is typing...</div>
    </div>
  `;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question: text})
    });

    const data = await res.json();
    const botMessageEl = document.getElementById(tempId);

    botMessageEl.innerText = data.answer;

    // ✅ speak only if enabled
    speak(data.answer);

  } catch (err) {
    document.getElementById(tempId).innerText = "Server error.";
  }

  chat.scrollTop = chat.scrollHeight;
}

// Image upload
document.getElementById("imageInput").addEventListener("change", async function() {
  const file = this.files[0];
  if (!file) return;

  const chat = document.getElementById("chat");
  const formData = new FormData();
  formData.append("image", file);

  chat.innerHTML += `<div class="message user">📷 Image sent</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/image", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    chat.innerHTML += `<div class="message bot">${data.answer}</div>`;

    // ✅ controlled voice
    speak(data.answer);

  } catch {
    chat.innerHTML += `<div class="message bot">Upload failed.</div>`;
  }

  chat.scrollTop = chat.scrollHeight;
});
</script>
